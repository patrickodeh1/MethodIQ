{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Student login</h1>
<p class="muted">Enter the phone number your instructor registered for you.</p>
<div class="card" style="max-width:360px;">
  <form method="post" action="/login">
    <label>Phone number</label>
    <input type="tel" name="phone_number" required placeholder="e.g. 09012345678">
    <button type="submit">Log in</button>
  </form>
  {% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
</div>
{% endblock %}
