{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<h1>MethodIQ admin login</h1>
<p class="muted">Administrators and staff use this same login. Staff sign in with the username and password created by an administrator.</p>
<div class="card" style="max-width:360px;">
  <form method="post" action="/admin/login">
    <label>Username</label><input type="text" name="username" required>
    <label>Password</label><input type="password" name="password" required>
    <button type="submit">Log in</button>
  </form>
  {% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
</div>
{% endblock %}
