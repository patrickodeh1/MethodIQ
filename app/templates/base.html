<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MethodIQ{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Method<span class="brand-iq">IQ</span></a>
    {% block header_right %}{% endblock %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">↑ Top</button>
  <script>
  document.querySelectorAll('.rich-editor').forEach(function (element) {
    const target = document.getElementById(element.dataset.target);
    const editor = new Quill(element, {
      theme: 'snow',
      modules: { toolbar: [
        [{ header: [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['blockquote', 'code-block', 'link'],
        ['clean']
      ] }
    });
    if (target && target.value) editor.root.innerHTML = target.value;
    if (target) element.closest('form').addEventListener('submit', function () {
      target.value = editor.root.innerHTML;
    });
  });
  </script>
  <script>
  (function () {
    const button = document.getElementById('back-to-top');
    if (!button) return;
    window.addEventListener('scroll', function () {
      button.classList.toggle('visible', window.scrollY > 320);
    });
    button.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
  </script>
</body>
</html>
